<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Light mode by default; dark only if the visitor explicitly chose it (applied before paint) -->
    <script>
      try {
        if (localStorage.getItem('genie_theme_choice') === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" href="/genie_symbol.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Genie | Sell Used Phones in 60s & Buy Certified Electronics</title>
    <meta name="description" content="Sell your old smartphone in 60 seconds with instant doorstep valuation & free pickup across Tamil Nadu. Buy certified refurbished smartphones with 1-year Genie warranty." />
    <link rel="preload" as="image" href="/genie_emblem.png" />
    <!-- Modern Plus Jakarta Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <!-- Google Identity Services (GIS) SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-amber-300 selection:text-slate-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
